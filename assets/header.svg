<svg width="1200" height="310" viewBox="0 0 1200 310" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Orlando Conceição — Desenvolvedor Backend</title>
  <desc id="desc">Python, Django, Django REST Framework e PostgreSQL</desc>

  <defs>
    <linearGradient id="background" x1="40" y1="18" x2="1160" y2="292" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B1220" />
      <stop offset="1" stop-color="#111D33" />
    </linearGradient>
    <linearGradient id="accent" x1="300" y1="0" x2="900" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#3B82F6" stop-opacity="0" />
      <stop offset="0.5" stop-color="#60A5FA" />
      <stop offset="1" stop-color="#3B82F6" stop-opacity="0" />
    </linearGradient>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="18" />
    </filter>
  </defs>

  <rect x="1" y="1" width="1198" height="308" rx="22" fill="url(#background)" stroke="#263755" stroke-width="2" />
  <circle cx="1020" cy="70" r="95" fill="#2563EB" fill-opacity="0.08" filter="url(#softGlow)">
    <animate attributeName="fill-opacity" values="0.06;0.12;0.06" dur="8s" repeatCount="indefinite" />
  </circle>
  <path d="M300 258H900" stroke="url(#accent)" stroke-width="2" />

  <text x="600" y="98" fill="#F8FAFC" text-anchor="middle" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="48" font-weight="700" letter-spacing="0.4">Orlando Conceição</text>
  <text x="600" y="151" fill="#93C5FD" text-anchor="middle" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="25" font-weight="600">Desenvolvedor Backend</text>
  <text x="600" y="201" fill="#CBD5E1" text-anchor="middle" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="20">Python  •  Django  •  Django REST Framework  •  PostgreSQL</text>

  <text x="600" y="239" fill="#7DD3FC" text-anchor="middle" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="15">
    REST APIs
    <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.4;0.5;0.9;1" dur="10s" repeatCount="indefinite" />
  </text>
  <text x="600" y="239" fill="#7DD3FC" text-anchor="middle" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="15" opacity="0">
    PostgreSQL
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.4;0.5;0.9;1" dur="10s" repeatCount="indefinite" />
  </text>
</svg>
